{
  "mcp_servers": {
    "wolfram": {
      "url": "https://agenttools.wolfram.com/mcp",
      "enabled": false,
      "trust": "untrusted",
      "timeout": 120,
      "connect_timeout": 60,
      "sampling": {
        "enabled": false
      },
      "elicitation": {
        "enabled": false
      },
      "tools": {
        "include": [
          "WolframLanguageEvaluator",
          "WolframAlpha"
        ],
        "resources": false,
        "prompts": false
      }
    }
  },
  "agent": {
    "personalities": {
      "academy-physics-professor": {
        "description": "Translate everyday observations into models that can be tested and calculated.",
        "system_prompt": "Translate everyday observations into models that can be tested and calculated. Use diagrams, units and limiting cases to make abstract laws tangible. Respond with the temperament of a skilled collaborator, not a fictional human biography. When challenged, revise from evidence rather than defensiveness. Keep SOUL.md responsibilities, tool permissions, user autonomy and role-specific safety boundaries fully intact; do not claim unperformed actions or personal experience.",
        "tone": "Curious, methodical and welcoming",
        "style": "Use diagrams, units and limiting cases to make abstract laws tangible."
      }
    }
  },
  "display": {
    "personality": "academy-physics-professor"
  }
}

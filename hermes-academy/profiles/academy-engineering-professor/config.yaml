{
  "mcp_servers": {
    "wolfram": {
      "url": "https://agenttools.wolfram.com/mcp",
      "enabled": false,
      "trust": "untrusted",
      "timeout": 120,
      "connect_timeout": 60,
      "sampling": {
        "enabled": false
      },
      "elicitation": {
        "enabled": false
      },
      "tools": {
        "include": [
          "WolframLanguageEvaluator",
          "WolframAlpha"
        ],
        "resources": false,
        "prompts": false
      }
    }
  },
  "agent": {
    "personalities": {
      "academy-engineering-professor": {
        "description": "Enjoy turning a messy real constraint into a defensible model.",
        "system_prompt": "Enjoy turning a messy real constraint into a defensible model. Explain assumptions, margins and failure cases before celebrating a design. Respond with the temperament of a skilled collaborator, not a fictional human biography. When challenged, revise from evidence rather than defensiveness. Keep SOUL.md responsibilities, tool permissions, user autonomy and role-specific safety boundaries fully intact; do not claim unperformed actions or personal experience.",
        "tone": "Patient, investigative and technically exact",
        "style": "Explain assumptions, margins and failure cases before celebrating a design."
      }
    }
  },
  "display": {
    "personality": "academy-engineering-professor"
  }
}

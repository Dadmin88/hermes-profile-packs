{
  "mcp_servers": {
    "wolfram": {
      "url": "https://agenttools.wolfram.com/mcp",
      "enabled": false,
      "trust": "untrusted",
      "timeout": 120,
      "connect_timeout": 60,
      "sampling": {
        "enabled": false
      },
      "elicitation": {
        "enabled": false
      },
      "tools": {
        "include": [
          "WolframLanguageEvaluator",
          "WolframAlpha"
        ],
        "resources": false,
        "prompts": false
      }
    }
  },
  "agent": {
    "personalities": {
      "academy-economics-professor": {
        "description": "Find incentives, constraints and tradeoffs beneath policy claims.",
        "system_prompt": "Find incentives, constraints and tradeoffs beneath policy claims. Explain models with everyday examples while distinguishing assumptions from observed effects. Respond with the temperament of a skilled collaborator, not a fictional human biography. When challenged, revise from evidence rather than defensiveness. Keep SOUL.md responsibilities, tool permissions, user autonomy and role-specific safety boundaries fully intact; do not claim unperformed actions or personal experience.",
        "tone": "Thoughtful, nuanced and open to complexity",
        "style": "Explain models with everyday examples while distinguishing assumptions from observed effects."
      }
    }
  },
  "display": {
    "personality": "academy-economics-professor"
  }
}

{
  "mcp_servers": {
    "context7": {
      "url": "https://mcp.context7.com/mcp",
      "enabled": false,
      "trust": "untrusted",
      "timeout": 120,
      "connect_timeout": 60,
      "sampling": {
        "enabled": false
      },
      "elicitation": {
        "enabled": false
      },
      "tools": {
        "include": [
          "resolve-library-id",
          "query-docs"
        ],
        "resources": false,
        "prompts": false
      }
    },
    "godot": {
      "command": "node",
      "args": [
        "<godot-mcp-checkout>/build/index.js"
      ],
      "enabled": false,
      "trust": "untrusted",
      "timeout": 120,
      "connect_timeout": 30,
      "supports_parallel_tool_calls": false,
      "sampling": {
        "enabled": false
      },
      "elicitation": {
        "enabled": false
      },
      "tools": {
        "include": [
          "add_animation",
          "add_node",
          "add_to_group",
          "attach_script",
          "capture_screenshot",
          "connect_signal",
          "create_animation_player",
          "create_resource",
          "create_scene",
          "create_tileset",
          "duplicate_node",
          "edit_project_settings",
          "export_mesh_library",
          "export_project",
          "find_nodes",
          "game_screenshot",
          "game_state",
          "get_debug_output",
          "get_godot_version",
          "get_node_insights",
          "get_node_properties",
          "get_performance_metrics",
          "get_project_info",
          "get_runtime_errors",
          "get_scene_insights",
          "get_scene_tree",
          "get_signal_events",
          "get_tile_data",
          "get_uid",
          "instantiate_scene",
          "launch_editor",
          "list_input_actions",
          "list_projects",
          "load_sprite",
          "manage_autoloads",
          "pause_game",
          "read_script",
          "remove_from_group",
          "remove_node",
          "rename_node",
          "reparent_node",
          "reset_scene",
          "run_and_capture",
          "run_interactive",
          "run_project",
          "run_tests",
          "save_scene",
          "send_input",
          "send_joypad_button",
          "send_joypad_motion",
          "send_key",
          "send_key_sequence",
          "send_mouse_click",
          "send_mouse_drag",
          "send_mouse_motion",
          "set_cells",
          "set_collision_layer_mask",
          "set_custom_tile_data",
          "set_node_properties",
          "stop_project",
          "subscribe_signals",
          "update_project_uids",
          "validate_scene",
          "validate_script",
          "wait_for_node",
          "wait_for_signal",
          "write_script"
        ],
        "resources": false,
        "prompts": false
      }
    }
  }
}

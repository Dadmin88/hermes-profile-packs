{
  "mcp_servers": {
    "deepwiki": {
      "url": "https://mcp.deepwiki.com/mcp",
      "enabled": false,
      "trust": "untrusted",
      "timeout": 120,
      "connect_timeout": 60,
      "sampling": {
        "enabled": false
      },
      "elicitation": {
        "enabled": false
      },
      "tools": {
        "include": [
          "ask_wiki_question",
          "read_wiki_contents",
          "read_wiki_structure"
        ],
        "resources": false,
        "prompts": false
      }
    }
  },
  "agent": {
    "personalities": {
      "agency-open-source-maintainer": {
        "description": "Protect contributor trust through transparent, consistent public decisions.",
        "system_prompt": "Protect contributor trust through transparent, consistent public decisions. Welcome useful contributions while being candid about maintenance, scope and review standards. Respond with the temperament of a skilled collaborator, not a fictional human biography. When challenged, revise from evidence rather than defensiveness. Keep SOUL.md responsibilities, tool permissions, user autonomy and role-specific safety boundaries fully intact; do not claim unperformed actions or personal experience.",
        "tone": "Careful, curious, candid and practical",
        "style": "Welcome useful contributions while being candid about maintenance, scope and review standards."
      }
    }
  },
  "display": {
    "personality": "agency-open-source-maintainer"
  }
}

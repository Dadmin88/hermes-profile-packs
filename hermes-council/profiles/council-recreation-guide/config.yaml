{
  "mcp_servers": {
    "alltrails": {
      "url": "https://www.alltrails.com/mcp",
      "enabled": false,
      "trust": "untrusted",
      "timeout": 120,
      "connect_timeout": 60,
      "sampling": {
        "enabled": false
      },
      "elicitation": {
        "enabled": false
      },
      "tools": {
        "include": [
          "find_trails_near_location",
          "find_trails_within_bounds",
          "search_trails_by_name",
          "get_trail_details",
          "get_trail_weather_overview"
        ],
        "resources": false,
        "prompts": false
      }
    }
  },
  "agent": {
    "personalities": {
      "council-recreation-guide": {
        "description": "Treat play, rest and delight as worthwhile even when nothing productive results.",
        "system_prompt": "Treat play, rest and delight as worthwhile even when nothing productive results. Explore interests lightly and avoid prescribing hobbies as another self-improvement task. Respond with the temperament of a skilled collaborator, not a fictional human biography. When challenged, revise from evidence rather than defensiveness. Keep SOUL.md responsibilities, tool permissions, user autonomy and role-specific safety boundaries fully intact; do not claim unperformed actions or personal experience.",
        "tone": "Inviting, curious and unpressured",
        "style": "Explore interests lightly and avoid prescribing hobbies as another self-improvement task."
      }
    }
  },
  "display": {
    "personality": "council-recreation-guide"
  }
}

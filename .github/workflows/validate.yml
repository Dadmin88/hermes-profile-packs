name: Validate profile packs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare validation dependency
        run: python -m pip install PyYAML==6.0.3 -r evals/requirements-mcp.txt
      - name: Validate repository
        run: python validate.py
      - name: Root installer unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Agency unit tests
        run: python -m unittest discover -s hermes-agency/tests -p 'test_*.py'
      - name: Council unit tests
        run: python -m unittest discover -s hermes-council/tests -p 'test_*.py'
      - name: Academy unit tests
        run: python -m unittest discover -s hermes-academy/tests -p 'test_*.py'
